<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- NaturalShot pide las fuentes de Windows (Segoe UI, Consolas). En el servidor no están y Linux ponía
     DejaVu Sans, más ancha: los textos se cortaban ("NaturalShc"). Liberation tiene las medidas de Arial
     y Courier, parecidas a las de Windows. -->
<fontconfig>
  <alias binding="same"><family>Segoe UI</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Segoe UI Variable Text</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Segoe UI Variable Display</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>sans-serif</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Cascadia Mono</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias binding="same"><family>Consolas</family><prefer><family>Liberation Mono</family></prefer></alias>
</fontconfig>
