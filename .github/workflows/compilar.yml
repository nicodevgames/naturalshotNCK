# Compila NaturalShot PRO para Windows y Mac en las máquinas de GitHub y publica una versión de prueba
# en este mismo repositorio. Nadie necesita tener Windows ni Mac para armarla.
#
# Se corre sola con cada cambio en main, o a mano: pestaña Actions > "Compilar y publicar" > Run workflow.
#
# Para probar, el link es siempre el mismo (la última versión):
#   https://github.com/nicodevgames/naturalshotNCK/releases/latest
# Ahí están:
#   NaturalShot-PRO-windows-instalador.exe   instala NaturalShot en Windows (lo más fácil)
#   NaturalShot-PRO-windows.zip      sin instalar: descomprimir TODO y abrir NaturalShot.exe
#   NaturalShot-PRO-mac-apple.dmg    Mac con chip Apple (M1, M2, M3, M4...)
#   NaturalShot-PRO-mac-intel.dmg    Mac con Intel
#
# Mac sin cuenta de Apple Developer: la primera vez se abre con clic derecho > Abrir (o Ajustes del
# Sistema > Privacidad y seguridad > Abrir igualmente). Después abre sola.

name: Compilar y publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compilar
  cancel-in-progress: true

jobs:
  compilar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nombre: windows
          - os: macos-latest      # chip Apple (arm64)
            nombre: mac-apple
          - os: macos-15-intel    # Intel (x86_64)
            nombre: mac-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Número de versión
        # Cada compilación es una versión nueva (1.0.<número de compilación>): así la app instalada
        # ve que hay una más nueva y se ofrece a actualizarse sola.
        shell: bash
        run: |
          python - <<'PY'
          import re, os
          p = "celular_natural/__init__.py"
          s = open(p, encoding="utf-8").read()
          base = re.search(r'__version__ = "(\d+)\.(\d+)', s)
          nueva = f"{base.group(1)}.{base.group(2)}.{os.environ['GITHUB_RUN_NUMBER']}"
          open(p, "w", encoding="utf-8").write(re.sub(r'__version__ = "[^"]+"', f'__version__ = "{nueva}"', s))
          print("Versión", nueva)
          PY

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Pruebas
        id: pruebas
        # Se informan en la versión, pero no frenan la compilación de prueba: en Mac varias pruebas son
        # de Windows (DPAPI, PowerShell, fuentes de C:\Windows).
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests

      - name: Resultado de las pruebas
        shell: bash
        run: echo "${{ matrix.nombre }}=${{ steps.pruebas.outcome }}" > pruebas-${{ matrix.nombre }}.txt

      - name: Compilar
        run: python -m PyInstaller --noconfirm --clean NaturalShot.spec

      - name: Empaquetar (Windows)
        if: matrix.nombre == 'windows'
        shell: pwsh
        env:
          MENSAJE: ${{ github.event.head_commit.message }}
        run: |
          # El zip ("NaturalShot PRO\" + LEEME) y version.json: lo que baja la app para actualizarse sola.
          python herramientas/paquete_ci.py dist/NaturalShot NaturalShot-PRO-windows.zip
          # El instalador (un solo .exe): evita que abran la app desde adentro del zip sin descomprimir.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $version = (Select-String -Path celular_natural/__init__.py -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          & $iscc /Qp "/DVersion=$version" instalador\NaturalShot.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "dist\instalador\NaturalShot-Setup-$version.exe" NaturalShot-PRO-windows-instalador.exe

      - name: Empaquetar (Mac)
        if: matrix.nombre != 'windows'
        run: |
          xattr -cr dist/NaturalShot.app
          codesign --force --deep --sign - dist/NaturalShot.app
          hdiutil create -volname "NaturalShot PRO" -srcfolder dist/NaturalShot.app -ov -format UDZO \
            "NaturalShot-PRO-${{ matrix.nombre }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: NaturalShot-${{ matrix.nombre }}
          path: |
            NaturalShot-PRO-*
            version.json
            pruebas-*.txt
          retention-days: 14

  publicar:
    needs: compilar
    # Publica lo que se haya podido compilar, aunque una de las tres falle.
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: salida
          merge-multiple: true

      - name: Publicar la versión de prueba
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          archivos=(salida/NaturalShot-PRO-* salida/version.json)
          if [ ${#archivos[@]} -eq 0 ]; then echo "No se compiló nada."; exit 1; fi
          VERSION=$(python3 -c "import re;m=re.search(r'__version__ = \"(\d+)\.(\d+)', open('celular_natural/__init__.py', encoding='utf-8').read());print(m.group(1)+'.'+m.group(2))").${{ github.run_number }}
          ETIQUETA="v${VERSION}"
          {
            echo "Versión de prueba de NaturalShot PRO ${VERSION}, compilada desde ${GITHUB_SHA::7}."
            echo
            echo "Si ya la tenés instalada en Windows, NaturalShot te avisa sola y se actualiza con un clic."
            echo
            echo "**Bajá el de tu compu:**"
            echo "- Windows: \`NaturalShot-PRO-windows-instalador.exe\` (lo instala y crea el acceso directo)."
            echo "  Sin instalar: \`NaturalShot-PRO-windows.zip\`, clic derecho › Extraer todo, y abrí \`NaturalShot PRO\\NaturalShot.exe\`."
            echo "- Mac con chip Apple (M1, M2, M3, M4): \`NaturalShot-PRO-mac-apple.dmg\`."
            echo "- Mac con Intel: \`NaturalShot-PRO-mac-intel.dmg\`."
            echo
            echo "En Mac: abrí el .dmg, arrastrá NaturalShot a Aplicaciones y la primera vez abrila con **clic derecho > Abrir**."
            echo
            echo "**Pruebas automáticas:**"
            for f in salida/pruebas-*.txt; do
              linea=$(cat "$f"); compu=${linea%%=*}; res=${linea#*=}
              if [ "$res" = "success" ]; then echo "- ${compu}: todas pasan"; else echo "- ${compu}: algunas fallan (ver Actions)"; fi
            done
          } > notas.md
          gh release create "$ETIQUETA" "${archivos[@]}" --title "NaturalShot PRO ${VERSION}" \
            --notes-file notas.md --target "$GITHUB_SHA" --latest
          echo "Publicada: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${ETIQUETA}"
